version: "2"
# weld:sqlcplugins:begin
# weld:sqlcplugins:end
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/query"
    gen:
      go:
        package: "sqlc"
        out: "internal/data/sqlc"
        sql_package: "pgx/v5"
        emit_empty_slices: true
    # weld:sqlccodegen:begin
    # weld:sqlccodegen:end
